<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>{{ page.title }} | {{ site.title }}</title>
        <link rel="stylesheet" href="{{ "/assets/css/style_base.css" | relative_url }}">
    </head>

    <body>
        <div class="main-column">
            <div class="container centered-text">
                <a class="text-title" href="{{ '/' | relative_url }}">~ {{ site.title }} ~</a>
            </div>
            <main>
                {{ content }}
            </main>
            <div class="footer">
                <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
            </div>
        </div>
    </body>

</html>
