<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>{{ page.title }} | {{ site.title }}</title>
        <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    </head>

    <body>
        <div class="container">
            <a class="text-title" href="<< "/" | relative_url }}">{{ site.title }}</a>
        </div>
        <main>
            {{ content }}
        </main>
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
        </div>
    </body>

</html>
